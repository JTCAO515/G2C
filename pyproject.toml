[project]
name = "cj"
version = "0.1.0"
description = "G2C / CJ Agent backend: API composition and domain modules (single distribution, ADR-0004)"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alibabacloud-oss-v2==1.4.1",
    "cryptography==50.0.2",
    "fastapi>=0.156.8",
    "h11==0.16.0",
    "httpx==0.28.1",
    "ortools==9.15.6755",
    "psycopg-pool==3.3.0",
    "psycopg[binary]==3.2.13",
    "pydantic>=2.14.1",
    "pyjwt[crypto]==2.15.1",
    "pypinyin==0.55.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.86.0",
    "jsonschema>=4.26.0",
    "openapi-spec-validator>=0.9.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Editable installs expose every domain directory, so no PYTHONPATH is needed.
dev-mode-dirs = [
    "backend",
    "backend/agent",
    "backend/auth",
    "backend/cleanup",
    "backend/draft",
    "backend/fact",
    "backend/feasibility",
    "backend/feedback",
    "backend/manual_edit",
    "backend/memory",
    "backend/memory_jobs",
    "backend/memory_management",
    "backend/memory_withdrawal",
    "backend/message",
    "backend/needs",
    "backend/place",
    "backend/run",
    "backend/strict_json",
    "backend/trip",
    "backend/usage",
]

[tool.hatch.build.targets.wheel]
# One distribution; each domain keeps its import name (cj_auth, cj_message, ...).
packages = [
    "backend/cj_api",
    "backend/runtime_adapter",
    "backend/agent/cj_agent",
    "backend/auth/cj_auth",
    "backend/cleanup/cj_cleanup",
    "backend/draft/cj_draft",
    "backend/fact/cj_fact",
    "backend/feasibility/cj_feasibility",
    "backend/feedback/cj_feedback",
    "backend/manual_edit/cj_manual_edit",
    "backend/memory/cj_memory",
    "backend/memory_jobs/cj_memory_jobs",
    "backend/memory_management/cj_memory_management",
    "backend/memory_withdrawal/cj_memory_withdrawal",
    "backend/message/cj_message",
    "backend/needs/cj_needs",
    "backend/place/cj_place",
    "backend/run/cj_run",
    "backend/strict_json/cj_strict_json",
    "backend/trip/cj_trip",
    "backend/usage/cj_usage",
]

[tool.hatch.build.targets.wheel.sources]
# Preserve the accepted domain import names in non-editable installs too.
"backend/cj_api" = "cj_api"
"backend/runtime_adapter" = "runtime_adapter"
"backend/agent/cj_agent" = "cj_agent"
"backend/auth/cj_auth" = "cj_auth"
"backend/cleanup/cj_cleanup" = "cj_cleanup"
"backend/draft/cj_draft" = "cj_draft"
"backend/fact/cj_fact" = "cj_fact"
"backend/feasibility/cj_feasibility" = "cj_feasibility"
"backend/feedback/cj_feedback" = "cj_feedback"
"backend/manual_edit/cj_manual_edit" = "cj_manual_edit"
"backend/memory/cj_memory" = "cj_memory"
"backend/memory_jobs/cj_memory_jobs" = "cj_memory_jobs"
"backend/memory_management/cj_memory_management" = "cj_memory_management"
"backend/memory_withdrawal/cj_memory_withdrawal" = "cj_memory_withdrawal"
"backend/message/cj_message" = "cj_message"
"backend/needs/cj_needs" = "cj_needs"
"backend/place/cj_place" = "cj_place"
"backend/run/cj_run" = "cj_run"
"backend/strict_json/cj_strict_json" = "cj_strict_json"
"backend/trip/cj_trip" = "cj_trip"
"backend/usage/cj_usage" = "cj_usage"

[tool.hatch.build.targets.wheel.shared-data]
"backend/fact/cj_fact/visitor.py" = "share/g2c/runtime-source/backend/fact/cj_fact/visitor.py"
"knowledge/visitor/entries" = "share/g2c/visitor/entries"
# Only public fixed inputs and policy sources hashed by source_c0().
"backend/agent/cj_agent/provider.py" = "share/g2c/runtime-source/backend/agent/cj_agent/provider.py"
"backend/agent/cj_agent/worker.py" = "share/g2c/runtime-source/backend/agent/cj_agent/worker.py"
"backend/cj_api/real_services.py" = "share/g2c/runtime-source/backend/cj_api/real_services.py"
