[project]
name = "cj-foundation"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "cryptography==50.0.2",
    "fastapi>=0.156.8",
    "pydantic>=2.14.1",
    "pyjwt[crypto]==2.15.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.86.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "openapi-spec-validator>=0.9.0",
    "pytest>=9.1.1",
]
