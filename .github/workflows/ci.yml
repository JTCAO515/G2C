# CI per ADR-0004: every job blocks. Local equivalent: scripts/check.sh.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CJ_ENV: local
  PYTHONDONTWRITEBYTECODE: "1"
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  python:
    # Unit, contract, wire and standalone checks that need no database.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: python3 -B scripts/handoff.py check
      - run: uv run --locked python -B scripts/test.py

  postgres:
    # Fresh private Unix-socket clusters only; migrations up/down/up plus every PG-backed suite.
    runs-on: ubuntu-latest
    env:
      CJ_PG_BINDIR: /usr/lib/postgresql/17/bin
      CJ_PG17_BINDIR: /usr/lib/postgresql/17/bin
      CJ_PG16_BINDIR: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 16 and 17 (PGDG)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-16 postgresql-17
          "$CJ_PG16_BINDIR/postgres" --version
          "$CJ_PG17_BINDIR/postgres" --version
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run --locked python -B scripts/pg_suites.py

  pr-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require an Issue reference in the PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PYTHON'
          import os, re
          if not re.search(r"(?i)\b(closes|fixes|resolves|refs)\s+#\d+", os.environ["PR_BODY"]):
              raise SystemExit("PR body must contain Closes/Fixes/Resolves/Refs #<issue number>")
          print("Issue reference present")
          PYTHON

  swift-packages:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.inventory.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - name: Reject missing or stale Swift package entries
        id: inventory
        run: python3 -B .github/scripts/swift_packages.py >> "$GITHUB_OUTPUT"

  swift:
    # Every package has an independent blocking job on the standard runner.
    needs: swift-packages
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.swift-packages.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode toolchain
        run: swift --version
      - name: Package tests (macOS host)
        env:
          SWIFT_PACKAGE: ${{ matrix.package }}
        run: swift test --package-path "$SWIFT_PACKAGE"
      - name: App Release configuration tests
        if: matrix.package == 'ios/App'
        run: swift test --package-path ios/App -c release

  ios-app:
    # The App target with the CJShell four-tab shell and all iOS modules, built for the simulator.
    # arm64 only: Swift 6.3.3 crashes in IRGen on the x86_64 slice of CJFeedbackClient/FeedbackView.swift.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode toolchain
        run: xcodebuild -version
      - name: Build App for iOS Simulator
        run: |
          xcodebuild -project ios/CJProbeApp.xcodeproj -scheme CJProbeApp \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
