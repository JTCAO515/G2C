# Minimal CI per ADR-0004 (P0). Blocking jobs cover suites that pass portably on main.
# The known-failing job is informational until P1 (pin removal, single package, migrations).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CJ_ENV: local
  PYTHONDONTWRITEBYTECODE: "1"
  # P0 only: domain test extras not yet in the root lock (consolidated in P1).
  CI_EXTRA_PY: psycopg[binary]==3.2.13 ortools==9.15.6755

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: |
          uv sync --locked
          uv pip install $CI_EXTRA_PY
      - name: Root API tests
        run: PYTHONPATH="$PWD/backend:$PWD/backend/auth:$PWD/backend/message" uv run --no-sync pytest -q backend/tests
      - name: Domain module tests
        run: |
          ALL=$(ls -d "$PWD"/backend/*/ | tr '\n' ':')
          for d in draft fact feedback manual_edit memory_jobs memory_withdrawal message place run usage; do
            echo "::group::backend/$d"
            (cd "backend/$d" && PYTHONPATH="$PWD:$GITHUB_WORKSPACE/backend:$ALL" uv run --no-sync --project "$GITHUB_WORKSPACE" pytest -q tests)
            echo "::endgroup::"
          done
      - name: Evaluation and ops tests
        run: |
          (cd evaluation/cj028 && PYTHONPATH=. uv run --no-sync --project "$GITHUB_WORKSPACE" pytest -q tests)
          (cd ops/recovery-preflight && uv run --no-sync --project "$GITHUB_WORKSPACE" pytest -q .)

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Validate OpenAPI contract
        run: uv run --no-sync openapi-spec-validator contracts/api/openapi.json

  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: iOS root package build and tests (macOS host)
        working-directory: ios
        run: |
          swift --version
          swift test

  known-failing:
    # Informational: tracks suites that fail on main for known reasons (see docs/handoff.json).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: |
          uv sync --locked
          uv pip install $CI_EXTRA_PY
      - name: Run known-failing suites without blocking
        run: |
          ALL=$(ls -d "$PWD"/backend/*/ | tr '\n' ':')
          status=0
          PYTHONPATH="$PWD/backend:$PWD/backend/auth:$PWD/backend/message" uv run --no-sync python -B -m unittest discover -s backend/cj_api/tests || status=1
          for d in auth cleanup feasibility needs trip; do
            echo "::group::backend/$d"
            (cd "backend/$d" && PYTHONPATH="$PWD:$GITHUB_WORKSPACE/backend:$ALL" uv run --no-sync --project "$GITHUB_WORKSPACE" pytest -q tests) || status=1
            echo "::endgroup::"
          done
          exit $status
