# CI per ADR-0004: every job blocks. Local equivalent: scripts/check.sh.
# Pull requests skip jobs by changed path (.github/scripts/ci_paths.py, JT approved 2026-11-24);
# a skipped job reports "skipped", which satisfies the required check. Pushes to main run every job.
# Main verifies only its newest commit (JT approved 2026-11-24, #1445), but a main run that has
# started always runs to the end: a new main push waits behind it and replaces the main push still
# waiting, if any, which GitHub cancels before it starts. So the commits skipped under a burst of
# merges never run, and each started run leaves a complete result a release can use. Re-runs never
# wait on or replace a main push run. A cancelled run is not re-run (ci-rerun.yml handles failures
# only), and its commit cannot be a release source.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # First attempts of main pushes share one group. Main pushes never cancel the running run
  # (cancel-in-progress is false for push); GitHub keeps at most one pending run per group and
  # cancels the older pending one when a newer push queues. A re-run (manual or ci-rerun.yml)
  # gets its own group per commit, so re-running an older commit never touches the newest main
  # run. Heads of the same PR still share their ref and cancel obsolete PR runs, as before.
  group: ${{ github.event_name != 'push' && format('ci-{0}', github.ref) || github.run_attempt == '1' && 'ci-main-push' || format('ci-main-rerun-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CJ_ENV: local
  PYTHONDONTWRITEBYTECODE: "1"
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  changes:
    # Fails open: any error leaves the outputs empty, so every dependent job still runs.
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      ios_only: ${{ steps.diff.outputs.ios_only }}
      app_changed: ${{ steps.diff.outputs.app_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # --no-renames lists both sides of a move, so a file moved out of backend/ still counts;
        # -z with core.quotePath=false passes non-ASCII names through unquoted.
        run: |
          git -c core.quotePath=false diff --name-only --no-renames -z "$BASE...$HEAD" > "$RUNNER_TEMP/changed.txt"
          tr '\0' '\n' < "$RUNNER_TEMP/changed.txt"
          python3 -B .github/scripts/ci_paths.py < "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/outputs.txt"
          cat "$RUNNER_TEMP/outputs.txt" | tee -a "$GITHUB_OUTPUT"

  python:
    # Unit, contract, wire and standalone checks that need no database.
    # Docs-only PRs keep the handoff check, the one check that reads docs.
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -B scripts/handoff.py check
      - name: Pull request path classifier tests
        run: python3 -B .github/scripts/test_ci_paths.py
      - name: Capacity-miss re-run decision tests
        run: python3 -B .github/scripts/test_ci_rerun.py
      - uses: astral-sh/setup-uv@v6
        if: needs.changes.outputs.docs_only != 'true'
      - run: uv sync --locked
        if: needs.changes.outputs.docs_only != 'true'
      - run: uv run --locked python -B scripts/test.py
        if: needs.changes.outputs.docs_only != 'true'

  postgres-shard:
    # Fresh private Unix-socket clusters only; migrations up/down/up plus every PG-backed suite.
    # Skipped for docs-only and iOS-only pull requests.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.ios_only != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with POSTGRES_SHARDS in deploy/hk/application_release.py (release gate).
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      CJ_PG_BINDIR: /usr/lib/postgresql/17/bin
      CJ_PG17_BINDIR: /usr/lib/postgresql/17/bin
      CJ_PG16_BINDIR: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 16 and 17 (PGDG) and eatmydata
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common eatmydata
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-16 postgresql-17
          "$CJ_PG16_BINDIR/postgres" --version
          "$CJ_PG17_BINDIR/postgres" --version
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # Groups are balanced by measured minutes (scripts/pg_suites.py MINUTES); each runs once.
      # eatmydata turns fsync into a no-op for the throwaway clusters on this disposable runner;
      # writes still reach the page cache, so process kills and restarts behave as before.
      # Two lanes per runner (4 vCPU): each lane runs half of this shard's groups in parallel,
      # lane 1 in its own copy of the checkout (.github/scripts/pg_lanes.sh).
      - name: PostgreSQL suites (two lanes)
        run: bash .github/scripts/pg_lanes.sh ${{ matrix.shard }} ${{ strategy.job-total }} 2

  postgres:
    # Stable required check. Passes only if every shard passed, or all were skipped for a
    # docs-only or iOS-only pull request.
    needs: [changes, postgres-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          IOS_ONLY: ${{ needs.changes.outputs.ios_only }}
          RESULT: ${{ needs.postgres-shard.result }}
        run: |
          test "$RESULT" = success || { { test "$DOCS_ONLY" = true || test "$IOS_ONLY" = true; } && test "$RESULT" = skipped; }

  swift-packages:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory, full coverage and failure propagation tests
        run: python3 -B .github/scripts/test_swift_packages.py
      - name: Reject missing or stale Swift package entries
        run: python3 -B .github/scripts/swift_packages.py

  swift:
    # Every package is tested on one runner, reusing locked compiler outputs.
    # Inventory order builds the broad Shell graph first; Cleanup has a distinct
    # locked swift-collections version and runs last to avoid repeated switches.
    # Skipped for pull requests that touch nothing the App reads (app_changed=false).
    needs: [changes, swift-packages]
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.app_changed != 'false' && needs.swift-packages.result == 'success' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode toolchain
        run: swift --version
      - name: Package tests (macOS host)
        run: python3 -B .github/scripts/swift_packages.py --run

  ios-app:
    # The App target with the CJShell four-tab shell and all iOS modules, built for the simulator.
    # arm64 only: Swift 6.3.3 crashes in IRGen on the x86_64 slice of CJFeedbackClient/FeedbackView.swift.
    # Skipped for pull requests that touch nothing the App reads (app_changed=false).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.app_changed != 'false' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode toolchain
        run: xcodebuild -version
      - name: Build App for iOS Simulator
        run: |
          xcodebuild -project ios/CJProbeApp.xcodeproj -scheme CJProbeApp \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
