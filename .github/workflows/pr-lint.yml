name: pr-lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require an Issue reference in the PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PYTHON'
          import os, re
          if not re.search(r"(?i)\b(closes|fixes|resolves|refs)\s+#\d+", os.environ["PR_BODY"]):
              raise SystemExit("PR body must contain Closes/Fixes/Resolves/Refs #<issue number>")
          print("Issue reference present")
          PYTHON
      - uses: actions/checkout@v4
        continue-on-error: true  # the report below is optional; pr-lint never fails for it
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Report open PRs that touch the same files (report only, never fails)
        # Open PRs must not overlap (docs/plan/issue-plan.md 现行流程 3); merge_pr.py stops the
        # merge itself when main changed the same files after this PR's CI started.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python3 -B .github/scripts/pr_overlap.py
