name: Hong Kong public readiness

on:
  schedule:
    # All day (#1720); GitHub may delay or drop scheduled runs under load.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      notification_drill:
        description: 'Deliberate notification-path failure; sends no server request'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: hk-public-readiness
  cancel-in-progress: false

jobs:
  observe:
    if: >-
      github.repository == 'JTCAO515/G2C' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      vars.HK_READINESS_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Observe only public health metadata
        env:
          NOTIFICATION_DRILL: ${{ inputs.notification_drill == true && 'true' || 'false' }}
        run: |
          if [ "$NOTIFICATION_DRILL" = true ]; then
            python3 -B -m deploy.hk.readiness_monitor --notification-drill
          else
            python3 -B -m deploy.hk.readiness_monitor
          fi
      - name: Notify the configured channel when the probe state changes
        # Channel is configuration (#1720): without HK_ALERT_WEBHOOK_URL only the failed run
        # itself notifies (GitHub's own workflow-failure email). Sends no server request.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
          ALERT_CHANNEL: ${{ secrets.HK_ALERT_WEBHOOK_URL != '' && 'webhook' || 'none' }}
          ALERT_WEBHOOK_URL: ${{ secrets.HK_ALERT_WEBHOOK_URL }}
          ALERT_WEBHOOK_FORMAT: ${{ vars.HK_ALERT_WEBHOOK_FORMAT || 'text' }}
        run: |
          previous=$(gh run list -R "$GITHUB_REPOSITORY" --workflow hk-readiness.yml --branch main \
            --status completed --limit 1 --json conclusion -q '.[0].conclusion' || echo unknown)
          python3 -B deploy/hk/ops_alerts.py probe-transition "$OUTCOME" "${previous:-unknown}"
