# Re-run main-push ci jobs that GitHub never gave a runner (hosted macOS arm64 capacity, #1445).
# Only jobs with no runner, zero steps and the "not acquired by Runner" annotation are re-run, at
# most twice; any job that ran and failed stops it (.github/scripts/ci_rerun.py). The schedule
# sweeps recent failed main pushes, because a re-run started with GITHUB_TOKEN does not fire
# workflow_run again. Code from the triggering run is never checked out. The step cannot fail
# this job, so the helper itself never records a failure on a main commit.
name: ci-rerun

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  schedule:
    - cron: '*/20 * * * *'

permissions:
  actions: write
  contents: read
  checks: read

jobs:
  rerun:
    if: >-
      github.event_name == 'schedule' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Re-run jobs that never acquired a runner
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 -B .github/scripts/ci_rerun.py
